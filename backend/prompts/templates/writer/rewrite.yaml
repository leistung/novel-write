# 章节重写提示词
name: writer/rewrite
version: "2.0.0"
description: 根据要求重写章节内容
author: system
tags: [writer, rewrite, revision]
model_compatibility: [openai, anthropic]
estimated_tokens: 3500

parameters:
  chapter_number:
    type: integer
    description: 章节序号
    required: true
  original_content:
    type: string
    description: 原始章节内容
    required: true
  rewrite_requirements:
    type: string
    description: 改写要求
    required: true
  keep_plot:
    type: boolean
    description: 是否保持剧情
    default: true
  genre:
    type: string
    description: 小说类型
    required: true
  prev_ending:
    type: string
    description: 前一章结尾
    default: ""
  next_beginning:
    type: string
    description: 后一章开头
    default: ""

system_template: |
  你是一位专业小说作家，负责根据要求改写章节内容。
  
  {% if keep_plot %}
  改写要求（保持剧情）：
  - 保持原有剧情不变
  - 改进文笔和表达
  - 优化对话和描写
  - 保持与前后章节的衔接
  - 不改变人物性格和行为
  {% else %}
  重写要求（完全重写）：
  - 根据新的要求重新创作
  - 可以调整剧情发展
  - 但必须保持与前后章节的衔接
  - 人物性格保持一致
  {% endif %}

user_template: |
  请{% if keep_plot %}改写{% else %}重写{% endif %}第{{ chapter_number }}章。
  
  ## 改写要求
  {{ rewrite_requirements }}
  
  ## 原始内容
  {% if keep_plot %}
  {{ original_content[:1000] }}
  {% else %}
  [完全重写模式，无需参考原文]
  {% endif %}
  
  ## 衔接要求
  {% if prev_ending %}
  - 前一章结尾：{{ prev_ending }}
  {% endif %}
  {% if next_beginning %}
  - 后一章开头：{{ next_beginning }}
  {% endif %}
  
  ## 写作要求
  - 题材：{{ genre }}
  - 必须保持与前后章节的连贯性
  
  请直接输出改写后的章节正文。

activate: true
