version: '3.8'

services:
  # ==================== 后端服务 ====================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novelwrite-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - ENV=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-novelwrite_dev_2024}@db:5432/novel_write
      - REDIS_URL=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-do-not-use-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
    volumes:
      - ./data:/app/data
      - ./store:/app/store
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - novelwrite-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==================== 前端服务 ====================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: novelwrite-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - novelwrite-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== Celery Worker ====================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novelwrite-celery
    restart: unless-stopped
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-novelwrite_dev_2024}@db:5432/novel_write
      - REDIS_URL=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-do-not-use-in-production}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
    volumes:
      - ./data:/app/data
      - ./store:/app/store
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - novelwrite-network

  # ==================== Celery Beat（定时任务）====================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novelwrite-beat
    restart: unless-stopped
    command: celery -A backend.tasks.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-novelwrite_dev_2024}@db:5432/novel_write
      - REDIS_URL=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-novelwrite_redis_2024}@redis:6379/0
    depends_on:
      - db
      - redis
    networks:
      - novelwrite-network

  # ==================== PostgreSQL数据库 ====================
  db:
    image: postgres:15-alpine
    container_name: novelwrite-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-novelwrite_dev_2024}
      - POSTGRES_DB=novel_write
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - novelwrite-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis缓存/队列 ====================
  redis:
    image: redis:7-alpine
    container_name: novelwrite-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-novelwrite_redis_2024}
    volumes:
      - redis_data:/data
    networks:
      - novelwrite-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-novelwrite_redis_2024}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== 监控：Prometheus ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: novelwrite-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - novelwrite-network
    profiles:
      - monitoring

  # ==================== 监控：Grafana ====================
  grafana:
    image: grafana/grafana:latest
    container_name: novelwrite-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - novelwrite-network
    profiles:
      - monitoring

# ==================== 网络配置 ====================
networks:
  novelwrite-network:
    driver: bridge

# ==================== 数据卷 ====================
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
